<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi GAS PWA</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>Aplikasi Mobile-ku</h1>
  <button id="btnAmbil">Ambil Data dari Sheets</button>

  <script>
    // Daftarkan Service Worker agar bisa jadi PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("PWA Terdaftar!"));
    }

    // Contoh nembak data ke GAS
    document.getElementById('btnAmbil').addEventListener('click', () => {
      fetch('https://script.google.com/macros/s/AKfycbxN0DFjyZnlxkcifZmD5Fs_ZehAGqV4X9Rr4JDroaJEVXK7yViFOBQjlTA7EXIfzWy2qQ/exec')
        .then(res => res.json())
        .then(data => alert("Data berhasil diambil!"));
    });
  </script>
</body>
</html>
